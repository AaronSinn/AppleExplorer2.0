<!DOCTYPE HTML>
<!--ctrl+shift+v to preview as you build-->

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Login Administration</title>

        <link rel="stylesheet" href="logstyles.css">
    </head>

    <body>
        <script src="NewUser.js"></script>
        <nav class="navbar fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Agriculture and Agri-Food Canada</a>
                <div>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="HomePage.html" style="color: #F5F5F5;">Return to Home Page</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4">
            <div class="row justify-content-center">
                <div class="col-6">
                    <div class="d-flex justify-content-center align-items-center vh-100">
                        <div class="card p-4">
                            <div class="card-body">
                                <h5 id="admin-login" class="card-title align-items-center">Administration Login</h5>

                                <form>
                                    <div class="row mt-4 mb-4">
                                        <div class="col">
                                            <label for="user-username" class="form-label text-start d-block"><strong>USERNAME</strong></label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="fa fa-user"></i></span>
                                                <input id="user-username" type="text" class="form-control" placeholder="example@mailaccount.com">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row mb-4">
                                        <div class="col">
                                            <label for="user-password" class="form-label text-start d-block"><strong>PASSWORD</strong></label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                                <input id="user-password" type="password" class="form-control" placeholder="Password">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-center mb-2">
                                        <button type="submit" class="btn btn-primary" id="generate-new-user" onclick="redirectToFirstTime()" disabled>SET UP YOUR SECURITY QUESTIONS</button>
                                    </div>
                                </form>
                                   
                                <p>New Users should login using their email and generated password. Follow the steps after to complete your user set-up.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="container-fluid">
            <div class="row">
                <div class="col-6 col-sm-3">
                    <span><i class="fa fa-envelope"></i><strong> CONTACT US</strong></span>
                </div>
                <div class="col">
                    <div class="text-center"><strong>© AGRICULTURAL AND AGRI-FOOD CANADA</strong></div>
                </div>
                <div class="col">
                    <div class="text-end"><strong>TERMS AND CONDITIONS</strong></div>
                </div>
            </div>
        </footer>
    </body>
</html>
