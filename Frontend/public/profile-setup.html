<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup - Apple Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="logstyles.css">
</head>
<body>
    <nav class="navbar fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Agriculture and Agri-Food Canada</a>
            <div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="homepage.html" style="color: #F5F5F5;">Return to Home Page</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4" style="padding-top: 80px;">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="d-flex justify-content-center align-items-center min-vh-100">
                    <div class="card p-4 w-100">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Complete Your Profile</h2>
                            <p class="text-center text-muted mb-4">Please provide additional information to set up your Apple Explorer profile.</p>

                            <!-- Message container -->
                            <div id="message-container"></div>

                            <form id="profile-setup-form">
                                <!-- Personal Information -->
                                <div class="row mb-4">
                                    <div class="col-12">
                                        <h5><i class="fas fa-user me-2"></i>Personal Information</h5>
                                        <hr>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="firstName" name="firstName" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="lastName" name="lastName" required>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone Number (Optional)</label>
                                        <input type="tel" class="form-control" id="phone" name="phone">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="organization" class="form-label">Organization (Optional)</label>
                                        <input type="text" class="form-control" id="organization" name="organization" placeholder="University, Company, etc.">
                                    </div>
                                </div>

                                <!-- Professional Information -->
                                <div class="row mb-4 mt-4">
                                    <div class="col-12">
                                        <h5><i class="fas fa-briefcase me-2"></i>Professional Information</h5>
                                        <hr>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="jobTitle" class="form-label">Job Title/Position (Optional)</label>
                                        <input type="text" class="form-control" id="jobTitle" name="jobTitle" placeholder="e.g., Researcher, Student, Farmer">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="department" class="form-label">Department/Field (Optional)</label>
                                        <input type="text" class="form-control" id="department" name="department" placeholder="e.g., Agriculture, Botany, Research">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="interests" class="form-label">Areas of Interest (Optional)</label>
                                        <textarea class="form-control" id="interests" name="interests" rows="3" placeholder="What aspects of apple research or agriculture interest you most?"></textarea>
                                    </div>
                                </div>

                                <!-- Location Information -->
                                <div class="row mb-4 mt-4">
                                    <div class="col-12">
                                        <h5><i class="fas fa-map-marker-alt me-2"></i>Location Information</h5>
                                        <hr>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="country" class="form-label">Country</label>
                                        <select class="form-select" id="country" name="country" required>
                                            <option value="">Select Country</option>
                                            <option value="Canada">Canada</option>
                                            <option value="United States">United States</option>
                                            <option value="United Kingdom">United Kingdom</option>
                                            <option value="Australia">Australia</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="province" class="form-label">Province/State (Optional)</label>
                                        <input type="text" class="form-control" id="province" name="province">
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg" id="profile-submit-btn">
                                        <span id="profile-submit-text">Complete Profile Setup</span>
                                        <span id="profile-submit-loading" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </span>
                                    </button>
                                </div>

                                <!-- Skip Option -->
                                <div class="text-center mt-3">
                                    <button type="button" class="btn btn-link" id="skip-profile-btn">
                                        Skip for now (you can complete this later in settings)
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="profile-setup.js"></script>
</body>
</html>
