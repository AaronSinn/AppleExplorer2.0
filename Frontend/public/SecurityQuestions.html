<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Security Questions</title>

        <link rel="stylesheet" href="security.css">
    </head>

    <body>
        <script src="SecurityQuestions.js"></script>
        <nav class="navbar fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Agriculture and Agri-Food Canada</a>
                <div>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="HomePage.html" style="color: #F5F5F5;">Return to Home Page</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4">
            <div class="row justify-content-center">
                <div class="col-6">
                    <div class="d-flex justify-content-center align-items-center vh-100">
                        <div class="card p-4">
                            <div class="card-body">
                                <form id="security-form">
                                    <!-- Choose mode via URL param or button -->
                                    <input type="hidden" id="user-mode" value="forgot"> <!-- Can be 'forgot' or 'first-time' -->

                                    <!-- FORGOT PASSWORD MODE -->
                                    <div class="row mt-4 mb-4" id="existing-question-group">
                                        <div class="col">
                                            <label for="security-question" class="form-label text-start d-block"><strong>Security Question</strong></label>
                                            <div class="input-group">
                                                <input id="security-question" type="text" class="form-control" disabled readonly value="What is your first pet’s name?">
                                            </div>
                                        </div>
                                    </div>

                                                                        <!-- FIRST-TIME MODE -->
                                    <div class="row mt-4 mb-4 d-none" id="new-question-group">
                                        <div class="col">
                                            <label for="select-question" class="form-label text-start d-block"><strong>Select a Security Question</strong></label>
                                            <div class="input-group">
                                                <select id="select-question" name="new-security-question" class="form-select" required>
                                                    <option value="" selected disabled>Choose a question</option>
                                                    <option value="What was your childhood nickname?">What was your childhood nickname?</option>
                                                    <option value="What is the name of your first school?">What is the name of your first school?</option>
                                                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                                                    <option value="What is your favorite food?">What is your favorite food?</option>
                                                    <option value="What is your first pet's name?">What is your first pet's name?</option>
                                                    <option value="In what city were you born?">In what city were you born?</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- SHARED FIELDS -->
                                    <div class="row mb-4">
                                        <div class="col">
                                            <label for="security-answer" class="form-label text-start d-block"><strong>Security Answer</strong></label>
                                            <div class="input-group">
                                                <input type="text" id="security-answer" name="security-answer" class="form-control" placeholder="Enter your security answer" required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row mb-4 d-none" id="confirm-answer-row">
                                        <div class="col">
                                            <label for="confirm-answer" class="form-label text-start d-block"><strong>Confirm Security Answer</strong></label>
                                            <div class="input-group">
                                                <input type="text" id="confirm-answer" name="confirm-answer" class="form-control" placeholder="Re-enter your security answer" required>
                                            </div>

                                    <div class="text-center mb-2">
                                        <button type="submit" class="btn btn-primary" id="reset-password">Continue</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="container-fluid">
            <div class="row">
                <div class="col-6 col-sm-3">
                    <span><i class="fa fa-envelope"></i><strong> CONTACT US</strong></span>
                </div>
                <div class="col">
                    <div class="text-center"><strong>© AGRICULTURAL AND AGRI-FOOD CANADA</strong></div>
                </div>
                <div class="col">
                    <div class="text-end"><strong>TERMS AND CONDITIONS</strong></div>
                </div>
            </div>
        </footer>
    </body>
</html>
