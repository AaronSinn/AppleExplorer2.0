<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agricultural and Agri-Food Canada - Search</title>
    <link rel="stylesheet" href="search-styles.css">
  <!-- Add jsPDF library for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Backup jsPDF loading with multiple CDN fallbacks -->
  <script>
    // Check if jsPDF loaded, if not try backup CDNs
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (typeof window.jsPDF === 'undefined' && typeof jsPDF === 'undefined') {
          console.log('Primary jsPDF failed, trying backup CDNs...');
          
          // Try backup CDN 1
          const script1 = document.createElement('script');
          script1.src = 'https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js';
          script1.onload = function() {
            console.log('Backup CDN 1 (unpkg) loaded successfully');
            if (typeof jsPDF !== 'undefined' && typeof window.jsPDF === 'undefined') {
              window.jsPDF = jsPDF;
            }
          };
          script1.onerror = function() {
            console.log('Backup CDN 1 failed, trying CDN 2...');
            
            // Try backup CDN 2
            const script2 = document.createElement('script');
            script2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.min.js';
            script2.onload = function() {
              console.log('Backup CDN 2 (cloudflare alt) loaded successfully');
              if (typeof jsPDF !== 'undefined' && typeof window.jsPDF === 'undefined') {
                window.jsPDF = jsPDF;
              }
            };
            script2.onerror = function() {
              console.error('All jsPDF CDNs failed to load');
            };
            document.head.appendChild(script2);
          };
          document.head.appendChild(script1);
        } else {
          console.log('jsPDF loaded successfully from primary CDN');
        }
      }, 500); // Give the primary script time to load
    });
  </script>
  
  <!-- Authentication utility -->
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  
  <!-- Update auth link based on login status -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const authLink = document.getElementById('auth-link');
      if (authLink && window.authManager) {
        if (window.authManager.isAuthenticated()) {
          authLink.textContent = 'LOGOUT';
          authLink.href = '#';
          authLink.addEventListener('click', function(e) {
            e.preventDefault();
            window.authManager.logout();
          });
        } else {
          authLink.textContent = 'LOGIN';
          authLink.href = 'LoginPage.html';
        }
      }
    });
  </script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="header-left">
        <h1>AGRICULTURAL AND AGRI-FOOD CANADA</h1>
      </div>
      <div class="header-right">
        <div class="admin-section">
          <span class="user-name-role"></span>
          <div class="user-profile">
            <div class="profile-icon">P</div>
          </div>
        </div>
        <nav>
          <ul>
            <li><a href="homepage.html">HOME</a></li>
            <li><a href="dashboard.html">DASHBOARD</a></li>
            <li><a href="search.html" class="active">SEARCH</a></li>
            <li><a href="user-management.html">USER</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="page-title">
      <h2>SEARCH</h2>
    </div>

    <!-- Search and Controls Section -->
    <section class="search-controls">
      <div class="controls-container">
        
        <!-- Search Bar -->

        <select name="search-by" id="search-by">
          <option value="none">All Fields</option>
        </select>
        <div class="search-section">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="SEARCH" autocomplete="off" />
            <button class="search-btn" title="Search database">🔍</button>

            <!-- Suggestion dropdown -->
             <div id = "suggestionsBox" class = "suggestions-box" style= "display:none;"></div>
          </div>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
          <button id="listViewBtn" class="view-btn active" title="Display database as list">List View
            <span id = "view-arrow" class="dropdown-arrow">▼</span> 
          </button>
          <button id="pictureViewBtn" class="view-btn" title="Display database as images">Picture View</button>
        </div>



        <!-- Import/Export Buttons -->
        <div class="import-export">
          <button id="importBtn" class="import-btn" title="Import database from JSON file">RESTORE FROM BACKUP</button>
          <button id="exportBtn" class="export-btn" title="Export database to JSON file">CREATE DATABASE BACKUP</button>
        </div>

        <!-- Filter Button -->
        <div class="filter-section">
          <button id="showHideBtn" class="filter-btn" title="Choose which columns to display">☑</button>
        </div>


      </div>
    </section>

    <!-- Bulk Actions Controls -->
    <section id="bulkActionsSection" class="bulk-actions-section" style="display: none;">
      <div class="bulk-actions-container">
        <div class="selected-count">
          <span id="selectedCount">0</span> entries selected
        </div>
        <div class="bulk-action-buttons">
          <button id="deleteSelectedBtn" class="delete-selected-btn">🗑️ Delete Selected</button>
          <button id="exportSelectedPdfBtn" class="export-selected-btn">📄 Export Selected as PDF</button>
          <button id="exportSelectedCsvBtn" class="export-selected-btn">📊 Export Selected as CSV</button>
          <button id="clearSelectionBtn" class="clear-selection-btn">✕ Clear Selection</button>
        </div>
      </div>
    </section>
    

    <!-- Export Controls -->
    <section id="exportControls" class="picture-export-controls">
      <div class="export-controls-container">
        <div class="sort-controls">
          <label id="sortSelectLabel" for="sortSelect">Sort by:</label>
          <select id="sortSelect">
          </select>
          <button id="sortOrderBtn" class="sort-order-btn" data-order="asc">↑ Ascending</button>
        </div>
        <div class="export-buttons">
          <button id="addEntryBtn" class="add-entry-btn" title="Add entry">➕ Add</button>
          <button id="editEntryBtn" class="edit-entry-btn" disabled = "true" title="Edit entry">✏️  Edit</button>
          <button id="delEntryBtn" class="del-entry-btn" disabled = "true" title="Delete entry">🗑️  Delete</button>
          <span id="confirmDeletionSpan" class="confirm-deletion-span" style="display: none;"></span>
          <button id="yesButton" class="confirm-deletion-btn" style="display: none;">Yes</button>
          <button id="noButton" class="confirm-deletion-btn" style="display: none;">No</button>
          <button id="exportPdfBtn" class="export-pdf-btn" disabled = "true" title="Export selected entries to PDF">📄 PDF</button>
          <button id="exportCsvBtn" class="export-csv-btn" disabled = "true" title="Export selected entries to CSV">📊 CSV</button>
        </div>
      </div>
    </section>

    <!-- Filter Panel (Hidden by default) -->
    <section id="filterPanel" class="filter-panel" style="display: none;">
      <div class="filter-container">
        <h3>Filter Options</h3>
        <div class="filter-grid" id="fgrid"></div>
        <div class="filter-actions">
          <button id="applyFilters" class="apply-btn">Apply Filters</button>
          <button id="clearFilters" class="clear-btn">Clear All</button>
        </div>
      </div>
    </section>

    <!-- Show/Hide Columns (Hidden by default) -->
    <section id="showHideColumns" class="filter-panel" style="display: none;">
      <div class="filter-container">
        <h3>Show/Hide Columns</h3>
        <div id="column-options-grid" class="filter-grid"></div>
            <div class="filter-actions">
          <button id="showAllColumns" class="apply-btn" title="Make all columns visible">Show All</button>
          <button id="hideAllColumns" class="clear-btn"title="Make all columns hidden">Hide All</button>
        </div>
      </div>
    </section>

    <!-- Data Table Section -->
    <section class="data-section">
      <div class="table-container">
        <!-- List View Table -->
        <div id="listView" class="table-view">
          <table id="dataTable">
            <thead>
              <tr id = "table-headers">
                <th class="checkbox-column">
                  <input type="checkbox" id="selectAll" title="Select All">
                </th>
              </tr>
              <tr id = "table-filters">
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Data will be populated here -->
            </tbody>
          </table>
        </div>

        <!-- Picture View Grid -->
        <div id="pictureView" class="picture-view" style="display: none;">
          <div class="picture-view-header">
            <h3 id="pictureViewTitle">Apple Species Information</h3>
            <div class="view-stats">
              <span id="totalCount">0 entries</span>
            </div>
          </div>
          <div id="pictureGrid" class="picture-grid">
            <!-- Picture cards will be populated here -->
          </div>
        </div>
      </div>


    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-center">
        <span>© AGRICULTURAL AND AGRI-FOOD CANADA</span>
      </div>
    </div>
  </footer>

  <!-- Add/Edit Entry Modal -->
  <div id="entryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Entry</h3>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <form id="entryForm">
            <div class="form-group">
              <label for="entryImage">Image</label>
              <input type="file" id="entryImage" accept="image/*">
              <div class="image-preview">
                <img id="imagePreview" style="display: none;">
              </div>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="saveEntry" class="save-btn" title="Save entry to database">Save Entry</button>
        <button id="cancelEntry" class="cancel-btn" title="Cancel entry">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Image Upload Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Upload Image</h3>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <div class="upload-area">
          <input type="file" id="imageUpload" accept="image/*" style="display: none;">
          <div class="upload-placeholder" onclick="document.getElementById('imageUpload').click()">
            <div class="upload-icon">📷</div>
            <p>Click to upload image</p>
          </div>
          <img id="uploadPreview" style="display: none;">
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveImage" class="save-btn" title="Save image">Save Image</button>
        <button id="cancelImage" class="cancel-btn" title="Cancel image">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Hidden file inputs for import/export -->
  <input type="file" id="importFile" accept=".json,.csv" style="display: none;">

  <!-- Authentication utility -->
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="search-script.js"></script>
</body>
</html>
